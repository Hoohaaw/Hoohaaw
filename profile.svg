<svg width="700" height="972" viewBox="0 0 700 972" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.10"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="700" height="972" rx="10" fill="#0a0f0a"/>

  <g font-family="Courier New, monospace" font-weight="bold" text-anchor="middle">
    <text x="350" y="130" font-size="64" fill="#C1440E">I'm Alex Palm</text>
  </g>
  <text x="350" y="170" font-family="Courier New, monospace" font-size="18" fill="#C1440E" fill-opacity="0.75" text-anchor="middle">
    Fullstack Developer &amp; UX/UI Designer — Madrid, Spain
  </text>
  <rect x="200" y="200" width="300" height="2" fill="#C1440E" fill-opacity="0.5"/>

  <g transform="translate(0,260)" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#C1440E">
    <text x="24" y="35"><tspan>alex@portfolio:~$ </tspan><tspan>whoami</tspan></text>
    <text x="24" y="59">  Alex Palm</text>
    <text x="24" y="83">  Fullstack Developer &amp; UX/UI Designer — Madrid, Spain</text>
    <text x="24" y="131"><tspan>alex@portfolio:~$ </tspan><tspan>cat about.txt</tspan></text>
    <text x="24" y="155">  LNU Web Developer Programme — completed June 2026</text>
    <text x="24" y="179">  B.Sc. Interaction Design, Linnaeus University</text>
    <text x="24" y="203">  Former Interaction Designer @ Gota Media AB</text>
    <text x="24" y="227">  UX research, design systems, WCAG accessibility</text>
    <text x="24" y="251">  Swedish (native)  English (fluent)  Spanish (learning)</text>
    <text x="24" y="299"><tspan>alex@portfolio:~$ </tspan><tspan>cat skills/frontend.txt</tspan></text>
    <text x="24" y="323">  React, React Router v7, JavaScript, TypeScript</text>
    <text x="24" y="347">  Vite, TanStack Query, Tailwind CSS, shadcn/ui</text>
    <text x="24" y="395"><tspan>alex@portfolio:~$ </tspan><tspan>cat skills/backend.txt</tspan></text>
    <text x="24" y="419">  Node.js, Express, Java, SQL, Python</text>
    <text x="24" y="443">  Supabase, Cloudflare Workers</text>
    <text x="24" y="467">  GraphQL, Apollo Server, MongoDB Atlas</text>
    <text x="24" y="515"><tspan>alex@portfolio:~$ </tspan><tspan>cat skills/tools.txt</tspan></text>
    <text x="24" y="539">  Stripe, Sanity.io, Mapbox, Figma</text>
    <text x="24" y="563">  Bruno, Git / GitLab CI-CD</text>
    <text x="24" y="611"><tspan>alex@portfolio:~$ </tspan><tspan>cat currently_improving.txt</tspan></text>
    <text x="24" y="635">  Python, Elixir, SQL, React</text>
    <text x="24" y="683">alex@portfolio:~$ </text>
    <rect x="186" y="670" width="8" height="15" fill="#C1440E">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0" y="0" width="700" height="972" rx="10" fill="url(#scanlines)"/>
</svg>
