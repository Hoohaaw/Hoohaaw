<svg width="700" height="972" viewBox="0 0 700 972" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.10"/>
    </pattern>
    <pattern id="staticSpecks" width="17" height="13" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="1.5" height="1.5" fill="#f2c94c" opacity="0.5"/>
      <rect x="9" y="8" width="1" height="1" fill="#C1440E" opacity="0.4"/>
      <rect x="13" y="1" width="1" height="1" fill="#f2c94c" opacity="0.35"/>
      <rect x="5" y="10" width="1" height="1" fill="#C1440E" opacity="0.3"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="700" height="972" rx="10" fill="#0a0f0a"/>

  <g font-family="Courier New, monospace" font-weight="bold" text-anchor="middle">
    <text x="350" y="130" font-size="64" fill="#C1440E">I'm Alex Palm</text>
  </g>
  <text x="350" y="170" font-family="Courier New, monospace" font-size="18" fill="#C1440E" fill-opacity="0.75" text-anchor="middle">
    Fullstack Developer &amp; UX/UI Designer — Madrid, Spain
  </text>
  <rect x="200" y="200" width="300" height="2" fill="#C1440E" fill-opacity="0.5"/>

  <rect x="16" y="234" width="668" height="722" rx="6" fill="none" stroke="#C1440E" stroke-opacity="0.35" stroke-width="1.5"/>

  <g transform="translate(0,260)" font-family="Courier New, monospace" font-size="15" font-weight="normal" fill="#C1440E">
    <text x="24" y="35" font-weight="bold"><tspan>alex@portfolio:~$ </tspan><tspan>whoami</tspan></text>
    <text x="24" y="59" fill-opacity="0.65">  Alex Palm</text>
    <text x="24" y="83" fill-opacity="0.65">  Fullstack Developer &amp; UX/UI Designer — Madrid, Spain</text>
    <text x="24" y="131" font-weight="bold"><tspan>alex@portfolio:~$ </tspan><tspan>cat about.txt</tspan></text>
    <text x="24" y="155" fill-opacity="0.65">  LNU Web Developer Programme — completed June 2026</text>
    <text x="24" y="179" fill-opacity="0.65">  B.Sc. Interaction Design, Linnaeus University</text>
    <text x="24" y="203" fill-opacity="0.65">  Former Interaction Designer @ Gota Media AB</text>
    <text x="24" y="227" fill-opacity="0.65">  UX research, design systems, WCAG accessibility</text>
    <text x="24" y="251" fill-opacity="0.65">  Swedish (native)  English (fluent)  Spanish (learning)</text>
    <text x="24" y="299" font-weight="bold"><tspan>alex@portfolio:~$ </tspan><tspan>cat skills/frontend.txt</tspan></text>
    <text x="24" y="323" fill-opacity="0.65">  React, React Router v7, JavaScript, TypeScript</text>
    <text x="24" y="347" fill-opacity="0.65">  Vite, TanStack Query, Tailwind CSS, shadcn/ui</text>
    <text x="24" y="395" font-weight="bold"><tspan>alex@portfolio:~$ </tspan><tspan>cat skills/backend.txt</tspan></text>
    <text x="24" y="419" fill-opacity="0.65">  Node.js, Express, Java, SQL, Python</text>
    <text x="24" y="443" fill-opacity="0.65">  Supabase, Cloudflare Workers</text>
    <text x="24" y="467" fill-opacity="0.65">  GraphQL, Apollo Server, MongoDB Atlas</text>
    <text x="24" y="515" font-weight="bold"><tspan>alex@portfolio:~$ </tspan><tspan>cat skills/tools.txt</tspan></text>
    <text x="24" y="539" fill-opacity="0.65">  Stripe, Sanity.io, Mapbox, Figma</text>
    <text x="24" y="563" fill-opacity="0.65">  Bruno, Git / GitLab CI-CD</text>
    <text x="24" y="611" font-weight="bold"><tspan>alex@portfolio:~$ </tspan><tspan>cat currently_improving.txt</tspan></text>
    <text x="24" y="635" fill-opacity="0.65">  Python, Elixir, SQL, React</text>
    <text x="24" y="683" font-weight="bold">alex@portfolio:~$ </text>
    <rect x="186" y="670" width="8" height="15" fill="#C1440E">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g>
    <rect x="0" y="88" width="700" height="1.5" fill="#C1440E" opacity="0.18"/>
    <rect x="0" y="341" width="480" height="1" fill="#f2c94c" opacity="0.15"/>
    <rect x="220" y="512" width="480" height="1.5" fill="#C1440E" opacity="0.16"/>
    <rect x="0" y="588" width="340" height="1" fill="#f2c94c" opacity="0.12"/>
    <rect x="60" y="742" width="640" height="1.5" fill="#C1440E" opacity="0.18"/>
    <rect x="0" y="905" width="560" height="1" fill="#f2c94c" opacity="0.12"/>
  </g>

  <rect x="0" y="0" width="700" height="972" rx="10" fill="url(#staticSpecks)"/>

  <rect x="0" y="0" width="700" height="972" rx="10" fill="url(#scanlines)"/>
</svg>
