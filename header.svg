<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="amberLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B5651D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C1440E" stop-opacity="1"/>
      <stop offset="100%" stop-color="#B5651D" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.08"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="280" rx="14" fill="#0a0f0a"/>

  <g font-family="Courier New, monospace" font-weight="bold" text-anchor="middle" filter="url(#glow)">
    <text x="600" y="140" font-size="88" fill="#C1440E">I'm Alex Palm</text>
  </g>

  <text x="600" y="185" font-family="Courier New, monospace" font-size="20" fill="#7a8a7a" text-anchor="middle">
    Fullstack Developer &amp; UX/UI Designer — Madrid, Spain
  </text>

  <rect x="300" y="210" width="600" height="3" fill="url(#amberLine)"/>

  <rect x="0" y="0" width="1200" height="280" rx="14" fill="url(#scanlines)"/>
</svg>
